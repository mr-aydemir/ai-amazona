name = "hivhestin-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://www.hivhestin.com,https://hivhestin.com,http://localhost:3000"

# Secrets (set with wrangler secret put):
# OPENROUTER_API_KEY = ...
# PROXY_TOKEN = ...        # optional shared token, sent as X-Proxy-Token
